spring.application.name=Locafesta

#mysql
spring.datasource.url=jdbc:mysql://localhost/bdlocafesta?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=


# XAMPP MariaDB 10.4 não aceita "ALTER TABLE IF EXISTS" do dialeto MySQL 8 do Hibernate 7.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
#JPA
spring.jpa.hibernate.ddl-auto=none

#SQL
spring.jpa.show-sql=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

mercadopago.access.token=APP_USR-919450145810048-101722-18a8407f5ab1c2a75fa7acca7ffee97a-3774264486

# Seed de gráficos do painel do locador (NUNCA true em produção)
